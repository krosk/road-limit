<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Road Limit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Nearest-turn badge: fixed top-right */
    #corner-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #corner-badge-speed {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #e33;
      color: #000;
      font-size: 30px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    #corner-badge-speed.over {
      background: #e33;
      color: #fff;
    }

    #corner-badge-dist {
      font-size: 12px;
      color: #fff;
      background: rgba(17, 17, 17, 0.75);
      padding: 2px 8px;
      border-radius: 6px;
    }

    /* Map: full screen */
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Speed overlay: top-left */
    #speed-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(17, 17, 17, 0.85);
      border-radius: 14px;
      padding: 10px 16px;
      z-index: 10;
      min-width: 110px;
    }

    #speed-overlay .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 2px;
    }

    #speed-value {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #speed-unit {
      font-size: 16px;
      color: #888;
      margin-left: 2px;
    }

    #road-name {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
      min-height: 16px;
    }

    /* Bottom panel */
    #bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 17, 17, 0.88);
      border-radius: 18px 18px 0 0;
      padding: 14px 16px 20px;
      z-index: 10;
    }

    /* G meters */
    .g-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .g-label {
      font-size: 11px;
      color: #666;
      width: 56px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .g-val {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    .g-bar-track {
      flex: 1;
      height: 10px;
      background: #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
    }

    .g-bar {
      height: 100%;
      border-radius: 5px;
      width: 0%;
      transition: width 0.08s linear, background 0.2s;
      background: #3a9;
    }

    .g-bar.warn { background: #f90; }
    .g-bar.over { background: #e33; }


    /* Status message */
    #status-msg {
      font-size: 10px;
      color: #fff;
      margin-top: 8px;
      text-align: right;
    }

    /* Threshold slider */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    .slider-row .g-label { width: 56px; flex-shrink: 0; }

    #threshold-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
    }

    #threshold-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f90;
      cursor: pointer;
    }

    #threshold-val {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Manual position input row */
    .pos-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
      flex-wrap: wrap;
    }

    #pos-toggle {
      background: transparent;
      color: #fff;
      border: 1px solid #666;
      border-radius: 12px;
      padding: 4px 0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }

    #pos-toggle.active { background: #f90; color: #000; border-color: #f90; }

    #pos-inputs {
      display: flex;
      gap: 6px;
      flex: 1;
      flex-wrap: wrap;
    }

    #pos-inputs input {
      width: 76px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      padding: 4px 6px;
      outline: none;
    }

    #pos-inputs input[readonly] {
      color: #666;
      border-color: #222;
    }

    #pos-apply {
      background: #f90;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    #pos-apply:disabled { opacity: 0.3; cursor: default; }

    /* Panel collapse toggle */
    #panel-toggle-row {
      display: flex;
      justify-content: center;
      margin: 6px 0 2px;
    }

    #panel-toggle-btn {
      background: transparent;
      border: none;
      color: #444;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 24px;
    }

    /* Debug: BFS start-node marker */
    .debug-start-node {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: #0ff;
      border: 2px solid #000;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* Speed badges on map */
    .speed-badge {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 0 3px #000, 0 0 6px #000;
      cursor: default;
      user-select: none;
    }

    .speed-badge.over { color: #e33; }

    /* Car dot marker */
    .car-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2196F3;
      border: 3px solid #fff;
      box-shadow: 0 0 6px rgba(33, 150, 243, 0.6);
    }

    /* Start screen */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    #start-screen h1 {
      font-size: 28px;
      font-weight: 700;
    }

    #start-screen p {
      font-size: 14px;
      color: #888;
      text-align: center;
      max-width: 280px;
    }

    #start-btn {
      background: #f90;
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    #start-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Start screen (needed for iOS motion permission) -->
  <div id="start-screen">
    <h1>Road Limit</h1>
    <p>Live speed, G-force, and turn warnings for your drive.</p>
    <button id="start-btn">Start</button>
  </div>

  <!-- Map (full screen) -->
  <div id="map"></div>

  <!-- Nearest-turn badge -->
  <div id="corner-badge">
    <div id="corner-badge-speed">—</div>
    <div id="corner-badge-dist"></div>
  </div>

  <!-- Speed overlay -->
  <div id="speed-overlay">
    <div class="label">Speed</div>
    <div>
      <span id="speed-value">0</span><span id="speed-unit">km/h</span>
    </div>
    <div id="road-name"></div>
    <div id="map-bearing" style="font-size:11px;color:#666;margin-top:3px;">↑ 0°</div>
    <div id="compass-raw" style="font-size:11px;color:#666;margin-top:1px;">compass —</div>
  </div>

  <!-- Bottom panel: G meters + turn warning + status -->
  <div id="bottom-panel">
    <div class="g-row">
      <span class="g-label">Lateral</span>
      <div class="g-bar-track"><div class="g-bar" id="lat-fill"></div></div>
      <span class="g-val" id="lat-val">0.00g</span>
    </div>
    <div class="g-row">
      <span class="g-label">Long.</span>
      <div class="g-bar-track"><div class="g-bar" id="long-fill"></div></div>
      <span class="g-val" id="long-val">0.00g</span>
    </div>

    <div id="panel-toggle-row">
      <button id="panel-toggle-btn">⌄</button>
    </div>

    <div id="panel-lower">
      <div class="slider-row">
        <span class="g-label">Threshold</span>
        <input type="range" id="threshold-slider" min="0.10" max="0.50" step="0.05" value="0.30">
        <span id="threshold-val">0.30 g</span>
      </div>

      <div class="pos-row">
        <button id="pos-toggle">GPS</button>
        <div id="pos-inputs">
          <input type="number" id="pos-lon" placeholder="Lon" step="0.0001" readonly>
          <input type="number" id="pos-lat" placeholder="Lat" step="0.0001" readonly>
          <input type="number" id="pos-hdg" placeholder="Hdg°" min="0" max="359" step="1" readonly>
          <button id="pos-apply" disabled>Apply</button>
        </div>
      </div>
      <div class="pos-row" style="margin-top:6px;padding-top:6px;">
        <span style="font-size:11px;color:#888;flex-shrink:0;width:44px;">Dist m</span>
        <input type="number" id="match-dist" value="30" min="10" max="500" step="10"
               style="width:72px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px;padding:4px 6px;outline:none;">
        <span style="font-size:11px;color:#888;">road match</span>
        <input type="number" id="lookahead-dist" value="120" min="10" max="2000" step="10"
               style="width:72px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px;padding:4px 6px;outline:none;margin-left:12px;">
        <span style="font-size:11px;color:#888;">lookahead</span>
        <button id="dbg-toggle" style="background:transparent;color:#fff;border:1px solid #666;border-radius:12px;padding:4px 0;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;width:44px;text-align:center;margin-left:auto;">DBG</button>
      </div>

      <div id="status-msg">Waiting…</div>
      <div id="version-msg" style="font-size:10px;color:#fff;margin-top:2px;text-align:right;"></div>
    </div>
  </div>

  <script type="module">
    import { haversine, bearingTo, angleDiff, destPoint, circumradius } from './lib/geo.js';
    import { matchRoad, collectAhead, detectTurn, detectAllTurns, corneringSpeed, segmentsAhead, parseSpeed } from './lib/road.js';
    import { gravityInDeviceFrame, removeGravity, phoneToWorldFrame, worldToCarFrame, applyEMA } from './lib/motion.js';

    // Show deployed timestamp from the file's Last-Modified header
    fetch('index.html', { method: 'HEAD' })
      .then(r => {
        const lm = r.headers.get('Last-Modified');
        if (lm) {
          const d = new Date(lm);
          document.getElementById('version-msg').textContent =
            'Deployed ' + d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
        }
      })
      .catch(() => {});

    // ── Config ─────────────────────────────────────────────────────────────────
    const CFG = {
      lateralGLimit:     0.30,
      longGLimit:        0.40,
      aThreshold:        0.30 * 9.81,
      lookahead:         120,
      smoothAlpha:       0.15,
      urgentDist:        200,
      minSpeedForHeading: 5 / 3.6,
      roadMatchMaxDist:  30,
    };

    // ── State ──────────────────────────────────────────────────────────────────
    const S = {
      lat: null, lon: null, speed: 0, heading: null, lastHeading: 0, accuracy: null,
      smoothLat: 0, smoothLong: 0, latG: 0, longG: 0,
      beta: 0, gamma: 0,
      prevLat: null, prevLon: null,
    };

    // ── Debug state ───────────────────────────────────────────────────────────
    let debugMode = false;

    // ── Mock features hook (Playwright / testing) ──────────────────────────────
    let _mockFeatures = null;
    window.__setMockFeatures = (f) => { _mockFeatures = f; };
    if (window.__mockFeatures !== undefined) _mockFeatures = window.__mockFeatures;

    // ── Manual position mode ───────────────────────────────────────────────────
    let posMode = 'gps';

    function applyManualPos() {
      const lon = parseFloat(document.getElementById('pos-lon').value);
      const lat = parseFloat(document.getElementById('pos-lat').value);
      const hdg = parseFloat(document.getElementById('pos-hdg').value);
      if (isNaN(lon) || isNaN(lat)) return;
      S.lon = lon;
      S.lat = lat;
      if (!isNaN(hdg)) { S.heading = hdg; S.lastHeading = hdg; }
      updateCarPosition(lon, lat);
      renderDashboard();
    }

    function setPosInputs(lon, lat, hdg) {
      document.getElementById('pos-lon').value = lon !== null ? lon.toFixed(5) : '';
      document.getElementById('pos-lat').value = lat !== null ? lat.toFixed(5) : '';
      document.getElementById('pos-hdg').value = hdg !== null ? Math.round(hdg) : '';
    }

    document.getElementById('pos-toggle').addEventListener('click', () => {
      posMode = posMode === 'gps' ? 'manual' : 'gps';
      const btn = document.getElementById('pos-toggle');
      const isManual = posMode === 'manual';
      btn.textContent = isManual ? 'SET' : 'GPS';
      btn.classList.toggle('active', isManual);
      ['pos-lon', 'pos-lat', 'pos-hdg'].forEach(id => {
        document.getElementById(id).readOnly = !isManual;
      });
      document.getElementById('pos-apply').disabled = !isManual;
    });

    document.getElementById('pos-apply').addEventListener('click', () => {
      if (posMode === 'manual') applyManualPos();
    });

    // ── Map & markers ──────────────────────────────────────────────────────────
    let map = null;
    let roadLayers = [];
    let carMarker = null;
    let badgeMarkers = [];

    function getRoadFeatures() {
      if (_mockFeatures !== null) return _mockFeatures;
      if (!map || !map.isStyleLoaded() || roadLayers.length === 0) return [];
      const raw = map.queryRenderedFeatures({ layers: roadLayers });
      // MapLibre returns MultiLineString for roads that cross tile boundaries.
      // Expand each into individual LineString features so lib code handles them.
      const f = [];
      for (const feat of raw) {
        const type = feat.geometry?.type;
        if (type === 'LineString') {
          f.push(feat);
        } else if (type === 'MultiLineString') {
          for (const coords of feat.geometry.coordinates) {
            f.push({ ...feat, geometry: { type: 'LineString', coordinates: coords } });
          }
        }
      }
      window.__lastFeatures = f;
      return f;
    }

    function initMap() {
      const maplibregl = window.maplibregl;
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [2.3522, 48.8566],
        zoom: 16,
        pitch: 60,
        attributionControl: false,
      });

      map.on('load', () => {
        // All line-type layers, regardless of source-layer name.
        // OpenFreeMap's liberty style may use source-layer names other than
        // 'transportation' for certain road categories.
        const NON_ROAD = new Set(['waterway', 'water', 'water_name', 'boundary',
                                   'landcover', 'landuse', 'contour']);
        roadLayers = map.getStyle().layers
          .filter(l => l.type === 'line' && !NON_ROAD.has(l['source-layer']))
          .map(l => l.id);

        map.addSource('segments-ahead', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'segments-ahead-line',
          type: 'line',
          source: 'segments-ahead',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 6,
            'line-opacity': 0.75,
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });

        map.addSource('debug-triplets', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'debug-triplets-line',
          type: 'line',
          source: 'debug-triplets',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 3,
            'line-opacity': 0.95,
            'line-dasharray': [5, 3],
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });

        map.addSource('debug-connectors', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'debug-connectors-line',
          type: 'line',
          source: 'debug-connectors',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 2,
            'line-opacity': 0.9,
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });
      });

      const updateMapBearing = () => {
        const b = ((map.getBearing() % 360) + 360) % 360;
        document.getElementById('map-bearing').textContent = `↑ ${Math.round(b)}°`;
      };
      map.on('rotate', updateMapBearing);
      map.on('load', updateMapBearing);

      // Blue car dot marker
      const dotEl = document.createElement('div');
      dotEl.className = 'car-dot';
      carMarker = new maplibregl.Marker({ element: dotEl })
        .setLngLat([2.3522, 48.8566])
        .addTo(map);

      // In manual mode, dragging the map moves the car to the map centre.
      // queryRenderedFeatures returns 0 while tiles are loading, so we also
      // re-render on idle (tiles fully loaded and rendered).
      let _dragPrev = null;
      map.on('dragstart', () => { _dragPrev = null; });
      map.on('drag', () => {
        if (posMode !== 'manual') return;
        const { lng, lat } = map.getCenter();
        if (_dragPrev !== null) {
          const d = haversine(_dragPrev.lat, _dragPrev.lng, lat, lng);
          if (d > 2) {
            S.heading = bearingTo(_dragPrev.lat, _dragPrev.lng, lat, lng);
            S.lastHeading = S.heading;
          }
        }
        _dragPrev = { lng, lat };
        S.lon = lng;
        S.lat = lat;
        setPosInputs(lng, lat, S.heading);
        carMarker.setLngLat([lng, lat]);
      });

      map.on('idle', () => {
        if (posMode === 'manual' && S.lat !== null) renderDashboard();
      });
    }

    function updateCarPosition(lon, lat) {
      if (!map || !carMarker) return;
      carMarker.setLngLat([lon, lat]);
      map.easeTo({ center: [lon, lat], bearing: S.lastHeading, duration: 300 });
    }

    // Interpolate [lon, lat] at cumulative distance d along a polyline.
    function ptAtDistance(pts, d) {
      let acc = 0;
      for (let i = 1; i < pts.length; i++) {
        const seg = haversine(pts[i - 1][1], pts[i - 1][0], pts[i][1], pts[i][0]);
        if (acc + seg >= d) {
          const t = seg > 0 ? (d - acc) / seg : 0;
          return [
            pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]),
            pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1]),
          ];
        }
        acc += seg;
      }
      return pts[pts.length - 1];
    }

    // Road bearing (degrees) at cumulative distance d along a polyline.
    function bearingAtDistance(pts, d) {
      let acc = 0;
      for (let i = 1; i < pts.length; i++) {
        const seg = haversine(pts[i - 1][1], pts[i - 1][0], pts[i][1], pts[i][0]);
        if (acc + seg >= d || i === pts.length - 1) {
          return bearingTo(pts[i - 1][1], pts[i - 1][0], pts[i][1], pts[i][0]);
        }
        acc += seg;
      }
      return 0;
    }

    function updateBadges(segments, currentSpeedKmh) {
      if (!map) return;
      for (const m of badgeMarkers) m.remove();
      badgeMarkers = [];
      const connectorFeatures = [];

      for (const seg of segments) {
        if (seg.isBehind) continue;

        if (debugMode) {
          const startEl = document.createElement('div');
          startEl.className = 'debug-start-node';
          startEl.textContent = '▶';
          badgeMarkers.push(
            new window.maplibregl.Marker({ element: startEl })
              .setLngLat(seg.pts[0])
              .addTo(map)
          );
        }

        for (const turn of (seg.turns ?? [])) {
          const limit = corneringSpeed(turn.radius, CFG.aThreshold);
          if (limit === null) continue;

          const el = document.createElement('div');
          el.className = 'speed-badge';
          const over = currentSpeedKmh > limit;
          if (over) el.classList.add('over');
          el.textContent = String(limit);

          const nodePos = ptAtDistance(seg.pts, turn.distance);
          let badgePos = nodePos;

          if (debugMode) {
            const roadBear = bearingAtDistance(seg.pts, turn.distance);
            const perpBear = (roadBear + 90) % 360;
            const [offLat, offLon] = destPoint(nodePos[1], nodePos[0], perpBear, 40);
            badgePos = [offLon, offLat];
            connectorFeatures.push({
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: [nodePos, badgePos] },
              properties: { color: over ? '#e33' : '#3a9' },
            });
          }

          const marker = new window.maplibregl.Marker({ element: el })
            .setLngLat(badgePos)
            .addTo(map);
          badgeMarkers.push(marker);
        }
      }

      if (map.getSource('debug-connectors')) {
        map.getSource('debug-connectors').setData({
          type: 'FeatureCollection',
          features: connectorFeatures,
        });
      }
    }

    function updateSegmentOverlay(segments, currentSpeedKmh) {
      if (!map || !map.getSource('segments-ahead')) return;
      const features = segments.map(seg => {
        // Color by the most restrictive turn in this segment
        const limits = (seg.turns ?? [])
          .map(t => corneringSpeed(t.radius, CFG.aThreshold))
          .filter(l => l !== null);
        const minLimit = limits.length > 0 ? Math.min(...limits) : null;
        let color = '#888';
        if (minLimit !== null) {
          if (currentSpeedKmh > minLimit)           color = '#e33';
          else if (currentSpeedKmh > minLimit - 10) color = '#f90';
          else                                      color = '#3a9';
        }
        return {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: seg.pts },
          properties: { color },
        };
      });
      map.getSource('segments-ahead').setData({ type: 'FeatureCollection', features });
    }

    function updateDebugTriplets(segments, maxTurnRadius) {
      if (!map || !map.getSource('debug-triplets')) return;
      if (!debugMode) {
        map.getSource('debug-triplets').setData({ type: 'FeatureCollection', features: [] });
        return;
      }
      const features = [];
      for (const seg of segments) {
        if (seg.isBehind) continue;
        const pts = seg.pts;
        for (let i = 1; i < pts.length - 1; i++) {
          const r = circumradius(pts[i - 1], pts[i], pts[i + 1]);
          features.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: [pts[i - 1], pts[i], pts[i + 1]] },
            properties: { color: r <= maxTurnRadius ? '#ff0' : '#555' },
          });
        }
      }
      map.getSource('debug-triplets').setData({ type: 'FeatureCollection', features });
    }

    // ── GPS ────────────────────────────────────────────────────────────────────
    function initGPS() {
      if (!navigator.geolocation) {
        setStatus('No GPS support');
        return;
      }
      navigator.geolocation.watchPosition(onPos, onGPSErr, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000,
      });
    }

    function onPos(pos) {
      if (posMode === 'manual') return;
      const { latitude: lat, longitude: lon, speed, heading, accuracy } = pos.coords;

      S.lat = lat;
      S.lon = lon;
      S.speed = speed ?? 0;
      S.accuracy = accuracy;

      // Update heading only when moving fast enough
      if (speed !== null && speed > CFG.minSpeedForHeading && heading !== null) {
        S.heading = heading;
        S.lastHeading = heading;
      } else if (speed !== null && speed > CFG.minSpeedForHeading &&
                 S.prevLat !== null && S.prevLon !== null) {
        // Compute heading from consecutive positions
        const computed = bearingTo(S.prevLat, S.prevLon, lat, lon);
        S.heading = computed;
        S.lastHeading = computed;
      }

      S.prevLat = lat;
      S.prevLon = lon;

      setPosInputs(lon, lat, S.lastHeading);
      updateCarPosition(lon, lat);
      renderDashboard();
    }

    function onGPSErr(err) {
      setStatus('GPS: ' + err.message);
    }

    // ── Motion / Accelerometer ─────────────────────────────────────────────────
    function initMotion() {
      const handler = (e) => {
        // Orientation angles from deviceorientation
        // beta / gamma come from deviceorientation, not devicemotion
        // We use what we have in S.beta, S.gamma

        let ax, ay, az;
        if (e.acceleration &&
            e.acceleration.x !== null &&
            e.acceleration.y !== null &&
            e.acceleration.z !== null) {
          // Pure acceleration without gravity
          ax = e.acceleration.x;
          ay = e.acceleration.y;
          az = e.acceleration.z;
        } else if (e.accelerationIncludingGravity &&
                   e.accelerationIncludingGravity.x !== null) {
          // Remove gravity component
          const raw = removeGravity(
            e.accelerationIncludingGravity.x,
            e.accelerationIncludingGravity.y,
            e.accelerationIncludingGravity.z,
            S.beta, S.gamma
          );
          ax = raw.x; ay = raw.y; az = raw.z;
        } else {
          return;
        }

        // Rotate to world frame, then to car frame
        const world = phoneToWorldFrame(ax, ay, az, S.beta, S.gamma);
        const car   = worldToCarFrame(world.east, world.north, S.lastHeading);

        const G = 9.81;
        const latRaw  = Math.abs(car.lateral)  / G;
        const longRaw = Math.abs(car.forward)  / G;

        S.smoothLat  = applyEMA(S.smoothLat,  latRaw,  CFG.smoothAlpha);
        S.smoothLong = applyEMA(S.smoothLong, longRaw, CFG.smoothAlpha);
        S.latG  = S.smoothLat;
        S.longG = S.smoothLong;

        renderGMeters();
      };

      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(r => { if (r === 'granted') window.addEventListener('devicemotion', handler); })
          .catch(() => {});
      } else {
        window.addEventListener('devicemotion', handler);
      }

      // Track orientation for gravity removal
      window.addEventListener('deviceorientation', (e) => {
        if (e.beta  !== null) S.beta  = e.beta;
        if (e.gamma !== null) S.gamma = e.gamma;
        const webkit = e.webkitCompassHeading;
        const alpha  = e.alpha;
        const el = document.getElementById('compass-raw');
        if (el) el.textContent = `wk ${webkit != null ? Math.round(webkit) : '—'}°  α ${alpha != null ? Math.round(alpha) : '—'}°`;
      });
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function renderDashboard() {
      const kmh = Math.round((S.speed ?? 0) * 3.6);
      document.getElementById('speed-value').textContent = kmh;

      // Road name from matched road
      const features = getRoadFeatures();
      const match = S.lat !== null
        ? matchRoad(features, S.lon, S.lat, S.heading)
        : null;

      if (match) {
        const props = match.feature.properties || {};
        const name = props.name || props.ref || '';
        document.getElementById('road-name').textContent = name;
      } else {
        document.getElementById('road-name').textContent = '';
      }

      // Segments ahead
      // maxRadius: curves with safe speed above 150 km/h at current threshold are ignored
      const maxTurnRadius = (150 / 3.6) ** 2 / CFG.aThreshold;
      const segments = segmentsAhead(
        features, S.lon, S.lat, S.heading, CFG.lookahead, maxTurnRadius, 0, CFG.roadMatchMaxDist
      );

      // Update map overlays
      updateBadges(segments, kmh);
      updateSegmentOverlay(segments, kmh);
      updateDebugTriplets(segments, maxTurnRadius);

      // Nearest-turn badge (always visible when a turn is ahead)
      let nearestTurn = null;
      let nearestLimit = null;
      for (const seg of segments) {
        if (seg.isBehind) continue;
        for (const turn of (seg.turns ?? [])) {
          if (nearestTurn === null || turn.distance < nearestTurn.distance) {
            nearestTurn = turn;
            nearestLimit = corneringSpeed(turn.radius, CFG.aThreshold);
          }
        }
      }
      const cornerBadge = document.getElementById('corner-badge');
      if (nearestTurn !== null && nearestLimit !== null) {
        cornerBadge.style.display = 'flex';
        const speedEl = document.getElementById('corner-badge-speed');
        speedEl.textContent = String(nearestLimit);
        speedEl.classList.toggle('over', kmh > nearestLimit);
        document.getElementById('corner-badge-dist').textContent = `in ${Math.round(nearestTurn.distance)} m`;
      } else {
        cornerBadge.style.display = 'none';
      }

      // Status
      const roadCount = features.length;
      const distStr = match ? `${Math.round(match.dist)} m to road` : 'no road';
      const aheadCount = segments.filter(s => !s.isBehind).length;
      const behindCount = segments.filter(s => s.isBehind).length;
      setStatus(`±${Math.round(S.accuracy ?? 0)} m · ${roadCount} roads · ${aheadCount}↑ ${behindCount}↓ edges · ${distStr}`);
    }

    function renderGMeters() {
      setBar('lat',  S.latG,  CFG.lateralGLimit);
      setBar('long', S.longG, CFG.longGLimit);
    }

    function setBar(id, value, limit) {
      const pct = Math.min(100, (value / (limit * 2)) * 100);
      const fill = document.getElementById(id + '-fill');
      fill.style.width = pct + '%';
      fill.className = 'g-bar'
        + (value > limit ? ' over' : value > limit * 0.7 ? ' warn' : '');
      document.getElementById(id + '-val').textContent = value.toFixed(2) + 'g';
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    // ── Threshold slider ───────────────────────────────────────────────────────
    document.getElementById('threshold-slider').addEventListener('input', (e) => {
      const g = parseFloat(e.target.value);
      CFG.aThreshold    = g * 9.81;
      CFG.lateralGLimit = g;
      document.getElementById('threshold-val').textContent = g.toFixed(2) + ' g';
      if (S.lat !== null) renderDashboard();
      renderGMeters();
    });

    // ── Match distance input ───────────────────────────────────────────────────
    document.getElementById('match-dist').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (isFinite(v) && v > 0) {
        CFG.roadMatchMaxDist = v;
        if (S.lat !== null) renderDashboard();
      }
    });

    document.getElementById('lookahead-dist').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (isFinite(v) && v > 0) {
        CFG.lookahead = v;
        if (S.lat !== null) renderDashboard();
      }
    });

    // ── Panel collapse ────────────────────────────────────────────────────────
    let panelExpanded = true;
    document.getElementById('panel-toggle-btn').addEventListener('click', () => {
      panelExpanded = !panelExpanded;
      const show = panelExpanded ? '' : 'none';
      document.getElementById('panel-lower').style.display = show;
      document.getElementById('road-name').style.display = show;
      document.getElementById('map-bearing').style.display = show;
      document.getElementById('compass-raw').style.display = show;
      document.getElementById('panel-toggle-btn').textContent = panelExpanded ? '⌄' : '⌃';
    });

    // ── Debug toggle ───────────────────────────────────────────────────────────
    document.getElementById('dbg-toggle').addEventListener('click', () => {
      debugMode = !debugMode;
      const btn = document.getElementById('dbg-toggle');
      btn.style.background = debugMode ? '#ff0' : 'transparent';
      btn.style.color = debugMode ? '#000' : '#fff';
      btn.style.borderColor = debugMode ? '#ff0' : '#666';
      if (S.lat !== null) renderDashboard();
    });

    // ── Start button ───────────────────────────────────────────────────────────
    document.getElementById('start-btn').addEventListener('click', async () => {
      // iOS DeviceMotion permission
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch (_) {}
      }

      document.getElementById('start-screen').style.display = 'none';
      initGPS();
      initMotion();
      try { initMap(); } catch (e) { console.error('Map init failed:', e); }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
</body>
</html>
