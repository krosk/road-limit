<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Road Limit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Turn column inside the speed card */
    #turn-card-arrow {
      color: #fff;
      margin-right: 6px;
      display: inline-flex;
      align-items: center;
    }

    #turn-card-speed {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #turn-card-speed.over {
      color: #e33;
    }

    #turn-card-unit {
      font-size: 16px;
      color: #888;
      margin-left: 2px;
    }

    #turn-card-info {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
      min-height: 16px;
    }

    #turn-col {
      display: none;
      padding-left: 16px;
      margin-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      justify-content: center;
      flex-direction: column;
    }

    /* Map: full screen */
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Speed card: top-left, always visible, grows right when turn is active */
    #speed-overlay {
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(17, 17, 17, 0.85);
      border-radius: 0 0 14px 0;
      padding: 8px 12px;
      z-index: 10;
      display: flex;
      flex-direction: row;
      align-items: center;
      min-width: 110px;
    }

    #speed-overlay .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 2px;
    }

    #speed-value {
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #speed-unit {
      font-size: 16px;
      color: #888;
      margin-left: 2px;
    }


    /* Bottom panel */
    #bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(17, 17, 17, 0.88);
      border-radius: 18px 18px 0 0;
      padding: 14px 16px 20px;
      z-index: 10;
    }

    /* G meters */
    .g-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .g-label {
      font-size: 11px;
      color: #666;
      width: 56px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .g-val {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    .g-bar-track {
      flex: 1;
      height: 10px;
      background: #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
    }

    .g-bar {
      height: 100%;
      border-radius: 5px;
      width: 0%;
      transition: width 0.08s linear, background 0.2s;
      background: #3a9;
    }

    .g-bar.warn { background: #f90; }
    .g-bar.over { background: #e33; }


    /* Status message */
    #status-msg {
      font-size: 10px;
      color: #fff;
      margin-top: 8px;
      text-align: right;
    }

    /* Threshold slider */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    .slider-row .g-label { width: 56px; flex-shrink: 0; }

    #threshold-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
    }

    #threshold-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f90;
      cursor: pointer;
    }

    #threshold-val {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Manual position input row */
    .pos-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
      flex-wrap: wrap;
    }

    #pos-toggle {
      background: transparent;
      color: #fff;
      border: 1px solid #666;
      border-radius: 12px;
      padding: 4px 0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      width: 44px;
      text-align: center;
    }

    #pos-toggle.active { background: #f90; color: #000; border-color: #f90; }

    #pos-inputs {
      display: flex;
      gap: 6px;
      flex: 1;
      flex-wrap: wrap;
    }

    #pos-inputs input {
      width: 76px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      padding: 4px 6px;
      outline: none;
    }

    #pos-inputs input[readonly] {
      color: #666;
      border-color: #222;
    }

    #pos-apply {
      background: #f90;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    #pos-apply:disabled { opacity: 0.3; cursor: default; }

    /* Panel toggle + fullscreen: left-edge button column inside the speed card */
    #card-btns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      padding-right: 12px;
      margin-right: 4px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    #panel-btn, #fullscreen-btn {
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #panel-btn:hover, #fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Debug: BFS start-node marker */
    .debug-start-node {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: #0ff;
      border: 2px solid #000;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    /* Speed badges on map */
    .speed-badge {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 0 3px #000, 0 0 6px #000;
      cursor: default;
      user-select: none;
    }

    .speed-badge.over { color: #e33; }

    /* Car dot marker */
    .car-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2196F3;
      border: 3px solid #fff;
      box-shadow: 0 0 6px rgba(33, 150, 243, 0.6);
    }

    /* Start screen */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    #start-screen h1 {
      font-size: 28px;
      font-weight: 700;
    }

    #start-screen p {
      font-size: 14px;
      color: #888;
      text-align: center;
      max-width: 280px;
    }

    #start-btn {
      background: #f90;
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    #start-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Start screen (needed for iOS motion permission) -->
  <div id="start-screen">
    <h1>Road Limit</h1>
    <p>Live speed, G-force, and turn warnings for your drive.</p>
    <button id="start-btn">Start</button>
  </div>

  <!-- Map (full screen) -->
  <div id="map"></div>

  <!-- Speed card (always visible) + turn column (shown when turn ahead) -->
  <div id="speed-overlay">
    <div id="card-btns">
      <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
      <button id="panel-btn" title="Toggle panel">▼</button>
    </div>
    <div id="speed-col">
      <div class="label">Speed</div>
      <div><span id="speed-value">0</span><span id="speed-unit">km/h</span></div>
    </div>
    <div id="turn-col">
      <div><span id="turn-card-arrow"></span><span id="turn-card-speed">—</span><span id="turn-card-unit">km/h</span></div>
      <div id="turn-card-info"></div>
    </div>
  </div>

  <!-- Bottom panel: G meters + turn warning + status -->
  <div id="bottom-panel">
    <div class="g-row">
      <span class="g-label">Lateral</span>
      <div class="g-bar-track"><div class="g-bar" id="lat-fill"></div></div>
      <span class="g-val" id="lat-val">0.00g</span>
    </div>
    <div class="g-row">
      <span class="g-label">Long.</span>
      <div class="g-bar-track"><div class="g-bar" id="long-fill"></div></div>
      <span class="g-val" id="long-val">0.00g</span>
    </div>

    <div class="slider-row">
        <span class="g-label">Threshold</span>
        <input type="range" id="threshold-slider" min="0.10" max="0.50" step="0.05" value="0.50">
        <span id="threshold-val">0.50 g</span>
      </div>

      <div class="pos-row">
        <button id="pos-toggle">GPS</button>
        <div id="pos-inputs">
          <input type="number" id="pos-lon" placeholder="Lon" step="0.0001" readonly>
          <input type="number" id="pos-lat" placeholder="Lat" step="0.0001" readonly>
          <input type="number" id="pos-hdg" placeholder="Hdg°" min="0" max="359" step="1" readonly>
          <button id="pos-apply" disabled>Apply</button>
        </div>
      </div>
      <div class="pos-row" style="margin-top:6px;padding-top:6px;">
        <span style="font-size:11px;color:#888;flex-shrink:0;width:44px;">Dist m</span>
        <input type="number" id="match-dist" value="30" min="10" max="500" step="10"
               style="width:72px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px;padding:4px 6px;outline:none;">
        <span style="font-size:11px;color:#888;">road match</span>
        <input type="number" id="lookahead-dist" value="120" min="10" max="2000" step="10"
               style="width:72px;background:#1a1a1a;border:1px solid #333;border-radius:6px;color:#fff;font-size:12px;padding:4px 6px;outline:none;margin-left:12px;">
        <span style="font-size:11px;color:#888;">lookahead</span>
        <button id="dbg-toggle" style="background:transparent;color:#fff;border:1px solid #666;border-radius:12px;padding:4px 0;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;width:44px;text-align:center;margin-left:auto;">DBG</button>
        <button id="overlay-toggle" style="background:transparent;color:#fff;border:1px solid #666;border-radius:12px;padding:4px 0;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;width:44px;text-align:center;">RD</button>
        <button id="copy-roads-btn" style="background:transparent;color:#fff;border:1px solid #666;border-radius:12px;padding:4px 0;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;width:44px;text-align:center;">CPY</button>
        <input type="file" id="load-roads-input" accept=".json" style="display:none">
        <button id="load-roads-btn" style="background:transparent;color:#fff;border:1px solid #666;border-radius:12px;padding:4px 0;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;width:44px;text-align:center;">LDR</button>
      </div>

      <div id="map-bearing" style="font-size:10px;color:#666;margin-top:6px;text-align:right;">↑ 0°</div>
      <div id="status-msg">Waiting…</div>
      <div id="version-msg" style="font-size:10px;color:#fff;margin-top:2px;text-align:right;"></div>
  </div>

  <script type="module">
    import { haversine, bearingTo, angleDiff, destPoint, ptAtDistance, bearingAtDistance } from './lib/geo.js';
    import { matchRoad, segmentsAhead, normaliseFeatures, firstTurnAhead } from './lib/road.js';
    import { DEFAULT_CFG } from './lib/config.js';
    import { createState, applyGPS, smoothCompass, applyMotion } from './lib/state.js';
    import { computeTurnCard, overlayGeoJSON, overlayBadgeItems, segmentsGeoJSON, statusText, barState, badgeItems, debugTripletFeatures, turnPathSVG, junctionBranchGeoJSON } from './lib/display.js';

    // Show deployed timestamp + commit SHA
    let _commitSha = '';
    Promise.all([
      fetch('index.html', { method: 'HEAD' }).then(r => r.headers.get('Last-Modified')).catch(() => null),
      fetch('https://api.github.com/repos/krosk/road-limit/commits/main').then(r => r.json()).catch(() => null),
    ]).then(([lm, commit]) => {
      const dateStr = lm ? new Date(lm).toISOString().slice(0, 16).replace('T', ' ') + ' UTC' : '';
      _commitSha = commit?.sha ? commit.sha.slice(0, 7) : '';
      const parts   = [dateStr && 'Deployed ' + dateStr, _commitSha].filter(Boolean);
      if (parts.length) document.getElementById('version-msg').textContent = parts.join(' · ');
    });

    // ── Config ─────────────────────────────────────────────────────────────────
    const CFG = { ...DEFAULT_CFG };

    // ── State ──────────────────────────────────────────────────────────────────
    const S = createState();

    // ── Debug state ───────────────────────────────────────────────────────────
    let debugMode = false;
    let overlayAll = false;

    // ── Mock features hook (Playwright / testing) ──────────────────────────────
    let _mockFeatures = null;
    window.__setMockFeatures = (f) => { _mockFeatures = f; };
    if (window.__mockFeatures !== undefined) _mockFeatures = window.__mockFeatures;

    // ── Manual position mode ───────────────────────────────────────────────────
    let posMode = 'gps';

    function applyManualPos() {
      const lon = parseFloat(document.getElementById('pos-lon').value);
      const lat = parseFloat(document.getElementById('pos-lat').value);
      const hdg = parseFloat(document.getElementById('pos-hdg').value);
      if (isNaN(lon) || isNaN(lat)) return;
      S.lon = lon;
      S.lat = lat;
      if (!isNaN(hdg)) { S.heading = hdg; S.lastHeading = hdg; }
      updateCarPosition(lon, lat);
      renderDashboard();
    }

    function setPosInputs(lon, lat, hdg) {
      document.getElementById('pos-lon').value = lon !== null ? lon.toFixed(5) : '';
      document.getElementById('pos-lat').value = lat !== null ? lat.toFixed(5) : '';
      document.getElementById('pos-hdg').value = hdg !== null ? Math.round(hdg) : '';
    }

    document.getElementById('pos-toggle').addEventListener('click', () => {
      posMode = posMode === 'gps' ? 'manual' : 'gps';
      const btn = document.getElementById('pos-toggle');
      const isManual = posMode === 'manual';
      btn.textContent = isManual ? 'SET' : 'GPS';
      btn.classList.toggle('active', isManual);
      ['pos-lon', 'pos-lat', 'pos-hdg'].forEach(id => {
        document.getElementById(id).readOnly = !isManual;
      });
      document.getElementById('pos-apply').disabled = !isManual;
      if (isManual && map) {
        const bearing = ((map.getBearing() % 360) + 360) % 360;
        S.heading = bearing;
        S.lastHeading = bearing;
        document.getElementById('pos-hdg').value = Math.round(bearing);
      }
    });

    document.getElementById('pos-apply').addEventListener('click', () => {
      if (posMode === 'manual') applyManualPos();
    });

    // ── Map & markers ──────────────────────────────────────────────────────────
    let map = null;
    let roadLayers = [];
    let carMarker = null;
    let badgeMarkers = [];

    function getRoadFeatures() {
      const useMock = _mockFeatures !== null;
      if (!map || !map.isStyleLoaded() || roadLayers.length === 0) {
        return useMock ? _mockFeatures : [];
      }
      const raw = map.queryRenderedFeatures({ layers: roadLayers });
      window.__lastRawCount = raw.length;
      window.__lastLayersQueried = roadLayers.length;

      // Per-layer min distance to car (for diagnostic payload)
      if (S.lat !== null) {
        let rawMinDist = Infinity;
        const layerMin = {};
        for (const feat of raw) {
          const geom = feat.geometry;
          if (!geom) continue;
          const rings = geom.type === 'MultiLineString' ? geom.coordinates : [geom.coordinates];
          let featMin = Infinity;
          for (const ring of rings) {
            for (const c of ring) {
              const d = haversine(S.lat, S.lon, c[1], c[0]);
              if (d < featMin) featMin = d;
            }
          }
          if (featMin < rawMinDist) rawMinDist = featMin;
          const lid = feat.layer?.id ?? 'unknown';
          if (!(lid in layerMin) || featMin < layerMin[lid]) layerMin[lid] = Math.round(featMin);
        }
        window.__lastRawMinDist = Math.round(rawMinDist);
        window.__lastRawLayerSummary = layerMin;
      } else {
        window.__lastRawMinDist = null;
        window.__lastRawLayerSummary = null;
      }

      if (useMock) return _mockFeatures;
      const f = normaliseFeatures(raw);
      window.__lastFeatures = f;
      return f;
    }

    function initMap() {
      const maplibregl = window.maplibregl;
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [2.3522, 48.8566],
        zoom: 16,
        pitch: 60,
        attributionControl: false,
      });

      map.on('load', () => {
        // All line-type layers, regardless of source-layer name.
        // OpenFreeMap's liberty style may use source-layer names other than
        // 'transportation' for certain road categories.
        const NON_ROAD = new Set(['waterway', 'water', 'water_name', 'boundary',
                                   'landcover', 'landuse', 'contour']);
        roadLayers = map.getStyle().layers
          .filter(l => l.type === 'line' && !NON_ROAD.has(l['source-layer']))
          .map(l => l.id);

        map.addSource('segments-ahead', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'segments-ahead-line',
          type: 'line',
          source: 'segments-ahead',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 6,
            'line-opacity': 0.75,
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });

        map.addSource('debug-triplets', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'debug-triplets-line',
          type: 'line',
          source: 'debug-triplets',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 3,
            'line-opacity': 0.95,
            'line-dasharray': [5, 3],
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });

        map.addSource('debug-connectors', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'debug-connectors-line',
          type: 'line',
          source: 'debug-connectors',
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 2,
            'line-opacity': 0.9,
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });

        map.addSource('junction-branches', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] },
        });
        map.addLayer({
          id: 'junction-branches-matched',
          type: 'line',
          source: 'junction-branches',
          filter: ['==', ['get', 'isMatched'], 1],
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 5,
            'line-opacity': 0.85,
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });
        map.addLayer({
          id: 'junction-branches-others',
          type: 'line',
          source: 'junction-branches',
          filter: ['==', ['get', 'isMatched'], 0],
          paint: {
            'line-color': ['get', 'color'],
            'line-width': 5,
            'line-opacity': 0.85,
            'line-dasharray': [4, 3],
          },
          layout: { 'line-cap': 'round', 'line-join': 'round' },
        });
      });

      const updateMapBearing = () => {
        const b = ((map.getBearing() % 360) + 360) % 360;
        const el = document.getElementById('map-bearing');
        const abs = el.dataset.abs ?? '—';
        el.textContent = `↑ ${Math.round(b)}°  ·  ${abs}°`;
        if (posMode === 'manual') {
          S.heading = b;
          S.lastHeading = b;
          document.getElementById('pos-hdg').value = Math.round(b);
        }
      };
      map.on('rotate', updateMapBearing);
      map.on('load', updateMapBearing);

      // Blue car dot marker
      const dotEl = document.createElement('div');
      dotEl.className = 'car-dot';
      carMarker = new maplibregl.Marker({ element: dotEl })
        .setLngLat([2.3522, 48.8566])
        .addTo(map);

      // In manual mode, dragging the map moves the car to the map centre.
      // queryRenderedFeatures returns 0 while tiles are loading, so we also
      // re-render on idle (tiles fully loaded and rendered).
      let _dragPrev = null;
      map.on('dragstart', () => { _dragPrev = null; });
      map.on('drag', () => {
        if (posMode !== 'manual') return;
        const { lng, lat } = map.getCenter();
        if (_dragPrev !== null) {
          const d = haversine(_dragPrev.lat, _dragPrev.lng, lat, lng);
          if (d > 2) {
            S.heading = bearingTo(_dragPrev.lat, _dragPrev.lng, lat, lng);
            S.lastHeading = S.heading;
          }
        }
        _dragPrev = { lng, lat };
        S.lon = lng;
        S.lat = lat;
        setPosInputs(lng, lat, S.heading);
        carMarker.setLngLat([lng, lat]);
      });

      map.on('idle', () => {
        if (posMode === 'manual' && S.lat !== null) renderDashboard();
      });
    }

    function updateCarPosition(lon, lat) {
      if (!map || !carMarker) return;
      carMarker.setLngLat([lon, lat]);
      map.easeTo({ center: [lon, lat], bearing: S.lastHeading, duration: 300 });
    }

    function updateBadges(items, segments, currentSpeedKmh) {
      if (!map) return;
      for (const m of badgeMarkers) m.remove();
      badgeMarkers = [];
      const connectorFeatures = [];

      if (debugMode) {
        for (const seg of segments) {
          if (seg.isBehind) continue;
          const startEl = document.createElement('div');
          startEl.className = 'debug-start-node';
          startEl.textContent = '▶';
          badgeMarkers.push(
            new window.maplibregl.Marker({ element: startEl })
              .setLngLat(seg.pts[0])
              .addTo(map)
          );
        }
      }

      for (const item of items) {
        const el = document.createElement('div');
        el.className = 'speed-badge';
        if (item.isOver) el.classList.add('over');
        el.textContent = String(item.limit);

        const nodePos = ptAtDistance(item.pts, item.turnDistance);
        let badgePos = nodePos;

        if (debugMode) {
          const roadBear = bearingAtDistance(item.pts, item.turnDistance);
          const perpBear = (roadBear + 90) % 360;
          const [offLat, offLon] = destPoint(nodePos[1], nodePos[0], perpBear, 40);
          badgePos = [offLon, offLat];
          connectorFeatures.push({
            type: 'Feature',
            geometry: { type: 'LineString', coordinates: [nodePos, badgePos] },
            properties: { color: item.isOver ? '#e33' : '#3a9' },
          });
        }

        badgeMarkers.push(
          new window.maplibregl.Marker({ element: el }).setLngLat(badgePos).addTo(map)
        );
      }

      if (map.getSource('debug-connectors')) {
        map.getSource('debug-connectors').setData({
          type: 'FeatureCollection',
          features: connectorFeatures,
        });
      }
    }

    function updateSegmentOverlay(segments, currentSpeedKmh) {
      if (!map || !map.getSource('segments-ahead')) return;
      map.getSource('segments-ahead').setData(
        segmentsGeoJSON(segments, currentSpeedKmh, CFG.aThreshold)
      );
    }

    function updateDebugTriplets(segments, maxTurnRadius) {
      if (!map || !map.getSource('debug-triplets')) return;
      map.getSource('debug-triplets').setData({
        type: 'FeatureCollection',
        features: debugMode ? debugTripletFeatures(segments, maxTurnRadius) : [],
      });
    }

    // ── GPS ────────────────────────────────────────────────────────────────────
    function initGPS() {
      if (!navigator.geolocation) {
        setStatus('No GPS support');
        return;
      }
      navigator.geolocation.watchPosition(onPos, onGPSErr, {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 15000,
      });
    }

    function onPos(pos) {
      if (posMode === 'manual') return;
      Object.assign(S, applyGPS(S, pos.coords, CFG.minSpeedForHeading));
      setPosInputs(S.lon, S.lat, S.lastHeading);
      updateCarPosition(S.lon, S.lat);
      renderDashboard();
    }

    function onGPSErr(err) {
      setStatus('GPS: ' + err.message);
    }

    // ── Motion / Accelerometer ─────────────────────────────────────────────────
    function initMotion() {
      const handler = (e) => {
        const update = applyMotion(S, e, CFG.smoothAlpha);
        if (update === null) return;
        Object.assign(S, update);
        renderGMeters();
      };

      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(r => { if (r === 'granted') window.addEventListener('devicemotion', handler); })
          .catch(() => {});
      } else {
        window.addEventListener('devicemotion', handler);
      }

      // Track orientation for gravity removal
      window.addEventListener('deviceorientation', (e) => {
        if (e.beta  !== null) S.beta  = e.beta;
        if (e.gamma !== null) S.gamma = e.gamma;
      });

      let _lastCompassApply = 0;
      window.addEventListener('deviceorientationabsolute', (e) => {
        if (e.alpha == null) return;

        S.smoothAbsHeading = smoothCompass(S.smoothAbsHeading, e.alpha);

        const el = document.getElementById('map-bearing');
        if (el) {
          el.dataset.abs = Math.round(e.alpha);
          const b = ((map.getBearing() % 360) + 360) % 360;
          el.textContent = `↑ ${Math.round(b)}°  ·  ${el.dataset.abs}°`;
        }

        // At low speed mirror what onPos does: update heading then rotate map
        if (posMode !== 'gps' || (S.speed ?? 0) >= CFG.minSpeedForHeading) return;
        if (S.lat === null) return;
        const now = Date.now();
        if (now - _lastCompassApply < 500) return;
        _lastCompassApply = now;
        S.heading = (S.smoothAbsHeading + 180) % 360;
        S.lastHeading = S.heading;
        updateCarPosition(S.lon, S.lat);
      });
    }

    // ── Render ─────────────────────────────────────────────────────────────────
    function renderDashboard() {
      const kmh = Math.round((S.speed ?? 0) * 3.6);
      document.getElementById('speed-value').textContent = kmh;

      // Road name from matched road
      const features = getRoadFeatures();
      const match = S.lat !== null
        ? matchRoad(features, S.lon, S.lat, S.heading)
        : null;

      // Segments ahead
      // maxRadius: curves with safe speed above 150 km/h at current threshold are ignored
      const maxTurnRadius = (150 / 3.6) ** 2 / CFG.aThreshold;
      const segments = segmentsAhead(
        features, S.lon, S.lat, S.heading, CFG.lookahead, maxTurnRadius, 0, CFG.roadMatchMaxDist
      );

      // Turn summary card (computed first — used by both overlay and card UI)
      const { pts: mainRoadPts, card: turnData, reason: turnReason, junctionGroups } = firstTurnAhead(
        segments, S.heading, CFG.lookahead, maxTurnRadius, CFG.aThreshold
      ) ?? { pts: null, card: null, reason: null, junctionGroups: null };
      const card = computeTurnCard(turnData, kmh);

      // For junction case, mainRoadPts is null. Fall back to the matched feature's
      // remaining coordinates (snapPt → feature endpoint = junction node) so the
      // current road is visible in the overlay even when the turn card is suppressed.
      const currentRoadPts = (turnReason === 'junction' && match)
        ? (match.forward
          ? match.coords.slice(Math.max(0, match.segIdx - 1))
          : [...match.coords.slice(0, match.segIdx + 2)].reverse())
        : null;
      const overlayPts = mainRoadPts ?? currentRoadPts;

      // The 2-node segment the car is currently on: always rendered in blue,
      // independent of which road firstTurnAhead selected for the path ahead.
      const matchedSegPts = match ? [match.snapPt, match.coords[match.segIdx]] : null;

      // Update map overlays
      updateBadges(overlayBadgeItems(segments, mainRoadPts, overlayAll, kmh, CFG.aThreshold, maxTurnRadius), segments, kmh);
      if (map && map.getSource('segments-ahead')) {
        map.getSource('segments-ahead').setData(overlayGeoJSON(segments, overlayPts, overlayAll, card, kmh, CFG.aThreshold));
      }
      if (map && map.getSource('junction-branches')) {
        map.getSource('junction-branches').setData(junctionBranchGeoJSON(junctionGroups, matchedSegPts));
      }
      updateDebugTriplets(segments, maxTurnRadius);
      const turnCardEl = document.getElementById('turn-col');
      if (card !== null) {
        turnCardEl.style.display = 'flex';
        document.getElementById('turn-card-arrow').innerHTML = turnPathSVG(mainRoadPts);
        const speedEl = document.getElementById('turn-card-speed');
        speedEl.textContent = String(card.minSpeed);
        speedEl.classList.toggle('over', card.isOver);
        const timeStr = card.timeToStart !== null ? `  ${card.timeToStart}s` : '';
        document.getElementById('turn-card-info').textContent = `${card.distanceToStart} m${timeStr}`;
      } else {
        turnCardEl.style.display = 'none';
      }

      setStatus(statusText(features, segments, match, S.accuracy, turnReason));

      const forward = segments.filter(s => !s.isBehind);

      // Annotate each feature with its min distance to the car for diagnostic use
      if (S.lat !== null) {
        for (const f of features) {
          let minD = Infinity;
          for (const c of f.geometry.coordinates) {
            const d = haversine(S.lat, S.lon, c[1], c[0]);
            if (d < minD) minD = d;
          }
          f._distToCar = Math.round(minD);
        }
      }

      window.__lastDiag = {
        commit:        _commitSha,
        timestamp:     new Date().toISOString(),
        position:      { lon: S.lon, lat: S.lat, heading: S.heading, accuracy: S.accuracy },
        speed:         kmh,
        map:           map ? { zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() } : null,
        cfg:           { lookahead: CFG.lookahead, roadMatchMaxDist: CFG.roadMatchMaxDist, aThreshold: CFG.aThreshold },
        match:         match ? { dist: Math.round(match.dist), road: match.feature.properties?.name ?? match.feature.properties?.ref ?? null, class: match.feature.properties?.class ?? null } : null,
        segments:      { forward: forward.length, behind: segments.filter(s => s.isBehind).length },
        forwardClasses: forward.map(s => s.pts?.length),
        turnReason,
        turnCard:      card,
        rawCount:         window.__lastRawCount ?? null,
        layersQueried:    window.__lastLayersQueried ?? null,
        rawMinDist:       window.__lastRawMinDist ?? null,
        rawLayerSummary:  window.__lastRawLayerSummary ?? null,
      };
    }

    function renderGMeters() {
      setBar('lat',  S.latG,  CFG.lateralGLimit);
      setBar('long', S.longG, CFG.longGLimit);
    }

    function setBar(id, value, limit) {
      const { pct, className, text } = barState(value, limit);
      const fill = document.getElementById(id + '-fill');
      fill.style.width = pct + '%';
      fill.className = 'g-bar' + (className ? ' ' + className : '');
      document.getElementById(id + '-val').textContent = text;
    }

    let statusPinnedUntil = 0;
    function setStatus(msg) {
      if (Date.now() < statusPinnedUntil) return;
      document.getElementById('status-msg').textContent = msg;
    }
    function pinStatus(msg, ms) {
      document.getElementById('status-msg').textContent = msg;
      statusPinnedUntil = Date.now() + ms;
    }

    // ── Threshold slider ───────────────────────────────────────────────────────
    document.getElementById('threshold-slider').addEventListener('input', (e) => {
      const g = parseFloat(e.target.value);
      CFG.aThreshold    = g * 9.81;
      CFG.lateralGLimit = g;
      document.getElementById('threshold-val').textContent = g.toFixed(2) + ' g';
      if (S.lat !== null) renderDashboard();
      renderGMeters();
    });

    // ── Match distance input ───────────────────────────────────────────────────
    document.getElementById('match-dist').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (isFinite(v) && v > 0) {
        CFG.roadMatchMaxDist = v;
        if (S.lat !== null) renderDashboard();
      }
    });

    document.getElementById('lookahead-dist').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (isFinite(v) && v > 0) {
        CFG.lookahead = v;
        if (S.lat !== null) renderDashboard();
      }
    });

    // ── Panel show/hide ───────────────────────────────────────────────────────
    let panelVisible = true;
    document.getElementById('panel-btn').addEventListener('click', () => {
      panelVisible = !panelVisible;
      document.getElementById('bottom-panel').style.display = panelVisible ? '' : 'none';
      document.getElementById('panel-btn').textContent = panelVisible ? '▼' : '▲';
    });

    // ── Fullscreen toggle ─────────────────────────────────────────────────────
    const fsBtn = document.getElementById('fullscreen-btn');
    const updateFsBtn = () => {
      fsBtn.textContent = document.fullscreenElement ? '⊡' : '⛶';
    };
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', updateFsBtn);

    // ── Debug toggle ───────────────────────────────────────────────────────────
    document.getElementById('dbg-toggle').addEventListener('click', () => {
      debugMode = !debugMode;
      const btn = document.getElementById('dbg-toggle');
      btn.style.background = debugMode ? '#ff0' : 'transparent';
      btn.style.color = debugMode ? '#000' : '#fff';
      btn.style.borderColor = debugMode ? '#ff0' : '#666';
      if (S.lat !== null) renderDashboard();
    });

    document.getElementById('overlay-toggle').addEventListener('click', () => {
      overlayAll = !overlayAll;
      const btn = document.getElementById('overlay-toggle');
      btn.style.background = overlayAll ? '#4af' : 'transparent';
      btn.style.color = overlayAll ? '#000' : '#fff';
      btn.style.borderColor = overlayAll ? '#4af' : '#666';

      if (S.lat !== null) renderDashboard();
    });

    // ── Download road topology as JSON file ────────────────────────────────────
    document.getElementById('copy-roads-btn').addEventListener('click', () => {
      const features = window.__lastFeatures;
      const btn = document.getElementById('copy-roads-btn');
      if (!features || features.length === 0) {
        btn.textContent = '—';
        setTimeout(() => { btn.textContent = 'CPY'; }, 1000);
        return;
      }
      const payload = { meta: window.__lastDiag ?? null, features };
      const text = JSON.stringify(payload);
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'roads.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = '✓';
      setTimeout(() => { btn.textContent = 'CPY'; }, 1500);
    });

    // ── Load roads JSON fixture ────────────────────────────────────────────────
    document.getElementById('load-roads-btn').addEventListener('click', () => {
      document.getElementById('load-roads-input').click();
    });

    document.getElementById('load-roads-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const btn = document.getElementById('load-roads-btn');
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const raw  = JSON.parse(ev.target.result);
          const meta = Array.isArray(raw) ? null : raw.meta;

          // Switch to SET mode and apply position from meta if available
          if (meta?.position?.lon != null) {
            posMode = 'manual';
            const toggle = document.getElementById('pos-toggle');
            toggle.textContent = 'SET';
            toggle.classList.add('active');
            document.getElementById('pos-apply').disabled = false;
            document.querySelectorAll('#pos-inputs input').forEach(i => i.removeAttribute('readonly'));
            S.lon = meta.position.lon;
            S.lat = meta.position.lat;
            S.heading = meta.position.heading ?? null;
            S.lastHeading = S.heading;
            S.accuracy = meta.position.accuracy ?? null;
            S.speed = (meta.speed ?? 0) / 3.6;
            setPosInputs(S.lon, S.lat, S.heading);
            updateCarPosition(S.lon, S.lat);
            if (map && meta.map) {
              map.jumpTo({
                center:  [S.lon, S.lat],
                zoom:    meta.map.zoom,
                pitch:   meta.map.pitch,
                bearing: meta.map.bearing,
              });
            }
            if (meta.cfg) {
              if (meta.cfg.lookahead    != null) { CFG.lookahead        = meta.cfg.lookahead;        document.getElementById('lookahead-dist').value = meta.cfg.lookahead; }
              if (meta.cfg.roadMatchMaxDist != null) { CFG.roadMatchMaxDist = meta.cfg.roadMatchMaxDist; document.getElementById('match-dist').value    = meta.cfg.roadMatchMaxDist; }
            }
          }

          renderDashboard();
          btn.textContent = '✓';
          pinStatus(`Position loaded` + (meta?.commit ? ` @ ${meta.commit}` : ''), 4000);
        } catch (err) {
          btn.textContent = '✗';
          pinStatus('LDR: ' + (err.message || err), 5000);
        }
        setTimeout(() => { btn.textContent = 'LDR'; }, 1500);
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // ── Start button ───────────────────────────────────────────────────────────
    document.getElementById('start-btn').addEventListener('click', async () => {
      // iOS DeviceMotion permission
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch (_) {}
      }

      document.getElementById('start-screen').style.display = 'none';
      initGPS();
      initMotion();
      try { initMap(); } catch (e) { console.error('Map init failed:', e); }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
</body>
</html>
